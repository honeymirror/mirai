# Mirai 3.0 —— 玩家可调参数声明（给 RenderDragonShaderLoader 用）
#
# 连续参数已由适配器迁移到 runtime uniform；这里保留原始宏名作为 UI 设置键和
# 旧配置兼容。曝光倍数现在映射到 ColorPostProcessing 的最终输出曝光，
# 原始 HDR EXPOSURE_MULTIPLIER 仍固定为源码默认值。
# Mirai 3.0 的材质是 albite 专用（shaders/shader.{frag,vert,comp}）。
profiles = windows

# ---------- 光照 ----------
option.MIDDLE_GRAY = 0.05 0.5 0.18
option.EXPOSURE_MULTIPLIER = 10.0 200.0 100.0
option.SKY_AMBIENT_MULTIPLIER = 0.0 5.0 2.0
option.BLOCK_AMBIENT_MULTIPLIER = 0.0 0.1 0.01
option.EMISSIVE_MATERIAL_INTENSITY = 0.0 1.0 0.1
option.BORDER_FOG_INTENSITY = 0.0 1.0 0.1
option.SUN_RADIANCE_MULTIPLIER = 0.0 3.0 1.0
option.MOON_RADIANCE_MULTIPLIER = 0.0 1.0 0.0

# ---------- 大气 ----------
option.AERIAL_SCALE = 0.0 3.0 1.0
option.ATMOSPHERE_HEIGHT = 50000.0 200000.0 100000.0
option.ATMOSPHERE_DENSITY = 0.0 3.0 1.0
option.RAYLEIGH_MAX_LUM = 0.0 5.0 2.5
option.MIE_MAX_LUM = 0.0 2.0 0.5
option.M_OZONE = 0.0 10.0 5.0
option.CAM_ALTITUDE = 0.0 500.0 100.0

# ---------- 云 ----------
option.CIRRUS_HEIGHT = 0.0 1000.0 580.0

# ---------- 界面分组与顺序 ----------
screen = MAIN
screen.MAIN = LIGHTING ATMOSPHERE CLOUDS
screen.MAIN.LIGHTING = MIDDLE_GRAY EXPOSURE_MULTIPLIER SKY_AMBIENT_MULTIPLIER BLOCK_AMBIENT_MULTIPLIER EMISSIVE_MATERIAL_INTENSITY BORDER_FOG_INTENSITY SUN_RADIANCE_MULTIPLIER MOON_RADIANCE_MULTIPLIER
screen.MAIN.ATMOSPHERE = AERIAL_SCALE ATMOSPHERE_HEIGHT ATMOSPHERE_DENSITY RAYLEIGH_MAX_LUM MIE_MAX_LUM M_OZONE CAM_ALTITUDE
screen.MAIN.CLOUDS = CIRRUS_HEIGHT
